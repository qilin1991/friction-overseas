name: friction-overseas

# 摩擦材料/制动器行业 · 海外信源采集
# 背景：VPS（腾讯云）出口 IP 被 Cloudflare 企业级挑战 / Akamai 拦截，
#       这批美国行业媒体（Counterman / Tire Business / Fleet Owner ...）在 VPS 上抓不到。
#       本工作流跑在 GitHub Actions（Azure 机房），用不同出口 IP 尝试突破。
#
# 步骤：探针（验证可达性）→ 采集 + 免费翻译 → 提交 news_overseas.json
# 下游：VPS 定时拉取该文件并合并进 friction 站
on:
  schedule:
    # 北京时间 08:30 / 20:30（UTC 00:30 / 12:30）
    - cron: '30 0 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:        # 支持手动触发，方便随时验证
    inputs:
      probe_only:
        description: '仅跑探针（验证 IP 可达性），不采集'
        type: boolean
        default: false
      proxy_probe:
        description: '额外测代理阅读器通道（r.jina.ai 等）'
        type: boolean
        default: false
      source_scan:
        description: '额外跑候选信源可达性普查'
        type: boolean
        default: false
      diag_sources:
        description: '诊断 SOURCES 每条规则（入口状态/命中数/路径样本）'
        type: boolean
        default: false
      probe_newsources:
        description: '探针四：候选新信源可达性 + Bing News RSS 覆盖普查'
        type: boolean
        default: false

permissions:
  contents: write           # 需要写权限才能 commit 结果

concurrency:
  group: friction-overseas
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet requests beautifulsoup4

      # ── 第 1 步：可达性探针 ────────────────────────────────────
      # 这一步是决策依据：确认 Azure 出口 IP 能否突破 WAF。
      # 无论结果如何都以 0 退出，只把结论写进 JSON 和 Step Summary。
      - name: 可达性探针
        run: python scripts/probe_overseas.py

      # ── 可选：代理阅读器探针 ──────────────────────────────────────
      # 测 r.jina.ai / allorigins 能否绕过 WAF。失败不影响主流程。
      - name: 代理阅读器探针
        if: ${{ inputs.proxy_probe }}
        continue-on-error: true
        run: python scripts/probe_proxy.py

      - name: 提交代理探针结论
        if: ${{ always() && inputs.proxy_probe }}
        continue-on-error: true
        run: |
          mkdir -p data
          if [ -f out/proxy_probe.json ]; then
            cp out/proxy_probe.json data/proxy_probe.json
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/proxy_probe.json
            git diff --cached --quiet || git commit -m "chore: 代理探针结论 [skip ci]"
            git push || true
          fi

      # ── 可选：逐源规则诊断 ────────────────────────────────────────
      # 输出每个源「入口状态 / links / hit / 站内路径样本」。
      # 用来区分「WAF 拦」「SPA 无链接」「正则失效」三种抓 0 条的原因。
      - name: 逐源规则诊断
        if: ${{ inputs.diag_sources }}
        continue-on-error: true
        run: python diag_sources.py

      - name: 提交逐源诊断结论
        if: ${{ always() && inputs.diag_sources }}
        continue-on-error: true
        run: |
          mkdir -p data
          if [ -f out/source_diag.json ]; then
            cp out/source_diag.json data/source_diag.json
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/source_diag.json
            git diff --cached --quiet || git commit -m "chore: 逐源诊断结论 [skip ci]"
            git push || true
          fi
          if [ -f out/source_diag_error.txt ]; then
            echo "=== 诊断脚本异常 ==="
            cat out/source_diag_error.txt
          fi

      - name: 显示逐源诊断摘要
        if: ${{ always() && inputs.diag_sources }}
        continue-on-error: true
        run: |
          if [ -f out/source_diag.json ]; then
            python - <<'PY'
          import json
          d = json.load(open('out/source_diag.json', encoding='utf-8'))
          ok = [r for r in d if 'OK(' in r['verdict']]
          bad = [r for r in d if 'OK(' not in r['verdict']]
          print(f"诊断 {len(d)} 源：OK {len(ok)} / 需处理 {len(bad)}")
          for r in bad:
              print(f"  [{r['verdict']}] {r['name']}")
          PY
          else
            echo "诊断未产出结果"
          fi

      # ── 可选：候选信源普查 ────────────────────────────────────────
      # 探测一批候选站点在 Azure IP 下能否直连，用于决定加哪些源。
      - name: 候选信源普查
        if: ${{ inputs.source_scan }}
        continue-on-error: true
        run: python scripts/probe_sources.py

      - name: 提交信源普查结论
        if: ${{ always() && inputs.source_scan }}
        continue-on-error: true
        run: |
          mkdir -p data
          if [ -f out/source_scan.json ]; then
            cp out/source_scan.json data/source_scan.json
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/source_scan.json
            git diff --cached --quiet || git commit -m "chore: 信源普查结论 [skip ci]"
            git push || true
          fi

      # ── 可选：候选新信源（2026-10-02）可达性 + 聚合覆盖普查 ────────
      - name: 候选新信源普查
        if: ${{ inputs.probe_newsources }}
        continue-on-error: true
        run: python scripts/probe_newsources.py

      - name: 提交新信源普查结论
        if: ${{ always() && inputs.probe_newsources }}
        continue-on-error: true
        run: |
          mkdir -p data
          if [ -f out/newsource_probe.json ]; then
            cp out/newsource_probe.json data/newsource_probe.json
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/newsource_probe.json
            git diff --cached --quiet || git commit -m "chore: 新信源普查结论 [skip ci]"
            git push || true
          fi

      - name: 显示探针结论
        if: always()
        run: |
          if [ -f out/probe_result.json ]; then
            python - <<'PY'
          import json
          d = json.load(open('out/probe_result.json', encoding='utf-8'))
          s, r = d['summary'], d['runner']
          print(f"出口 IP: {r['egress_ip']}")
          print(f"可通 {s['ok']}/{s['total']}，WAF 拦截 {s['waf']} 个")
          print(f"判定: {s['verdict']}")
          PY
          else
            echo "探针未产出结果"
          fi

      # ── 第 2 步：采集 + 翻译 ───────────────────────────────────
      - name: 采集海外信源
        if: ${{ !inputs.probe_only }}
        run: python scripts/collect_overseas.py

      # ── 第 2b 步：WAF 站兜底（第三方聚合）──────────────────────
      # 直连被 WAF 拦的站点，改走 Google/Bing News RSS 拿标题线索。
      # 该步失败不影响前面的直采结果。
      - name: 聚合兜底采集
        if: ${{ !inputs.probe_only }}
        continue-on-error: true
        run: python scripts/collect_via_aggregator.py

      # ── 第 2c 步：存量补正文（enrich）──────────────────────────
      # 对历史仅标题条目进原文页抓正文（Azure 出口），增量每轮 250 条，
      # 产出 out/news_content.json → VPS 合并端按 url 回填 article 表。
      - name: 存量补正文
        if: ${{ !inputs.probe_only }}
        continue-on-error: true
        run: python scripts/enrich_content.py

      # ── 第 2d 步：免费翻译正文（Google 免费端点，无 LLM、无 key）─
      # VPS 推送 data/translate_queue.json（待翻译存量清单），
      # 本步分块翻译 → out/news_zh.json → 提交 data/ 供 VPS 回填 content_zh。
      - name: 免费翻译正文
        if: ${{ !inputs.probe_only }}
        continue-on-error: true
        run: python scripts/translate_content.py

      # ── 第 3 步：提交结果 ──────────────────────────────────────
      # 独立仓库，直接写 data/ 目录
      - name: 提交 news_overseas.json
        if: ${{ !inputs.probe_only }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          cp out/news_overseas.json data/news_overseas.json
          git add data/news_overseas.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            CNT=$(python -c "import json;print(json.load(open('data/news_overseas.json',encoding='utf-8'))['count'])")
            git commit -m "chore: 海外资讯同步 ${CNT} 条 [skip ci]"
            git push
          fi

      - name: 提交正文回填数据
        if: ${{ !inputs.probe_only }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          if [ -f out/news_content.json ]; then
            cp out/news_content.json data/news_content.json
            git add data/news_content.json
            if git diff --cached --quiet; then
              echo "正文回填数据无变化"
            else
              git commit -m "chore: 正文回填数据 [skip ci]"
              git push
            fi
          else
            echo "无 news_content.json"
          fi

      - name: 提交翻译结果
        if: ${{ !inputs.probe_only }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          if [ -f out/news_zh.json ]; then
            cp out/news_zh.json data/news_zh.json
            git add data/news_zh.json
            if git diff --cached --quiet; then
              echo "翻译结果无变化"
            else
              git commit -m "chore: 正文中文翻译（Google 免费端点）[skip ci]"
              git push
            fi
          else
            echo "无 news_zh.json"
          fi

      - name: 上传探针结果（便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: out/probe_result.json
          if-no-files-found: warn
          retention-days: 14

      # ── 第 4 步：把探针结论也提交进仓库 ────────────────────────
      # artifact 下载走 Azure blob，部分网络环境取不到；
      # 落盘到 data/ 后可直接通过 GitHub 网页 / raw 链接查看。
      - name: 提交探针结论
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          if [ -f out/probe_result.json ]; then
            cp out/probe_result.json data/probe_result.json
            git add data/probe_result.json
            if git diff --cached --quiet; then
              echo "探针结论无变化"
            else
              git commit -m "chore: 探针结论更新 [skip ci]"
              git push
            fi
          else
            echo "无探针结果文件"
          fi
