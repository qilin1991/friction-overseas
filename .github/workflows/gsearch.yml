name: gsearch

# Google 搜索（真浏览器），给 VPS 的 /wproxy/g 与 archive 检索链用
#
# 为什么只能在 Actions 上跑：Google 对无 JS 的请求一律回 enablejs 拦截页
# （2026-10 实测 gbv=1 / udm=14 全部失效），必须真浏览器执行 JS；
# VPS 直连被墙、CF Worker 出口被 Google 429。
#
# 🔴 结果不用 artifact 回传（pipelines.actions.githubusercontent.com 在 VPS 上被 reset），
#    改为 commit 到 data/gh_search/<key>.json，VPS 用 contents 接口读。
on:
  workflow_dispatch:
    inputs:
      key:
        description: '调用方生成的随机 key'
        required: true
        type: string
      q:
        description: '搜索词'
        required: true
        type: string
      num:
        description: '要多少条（10~30）'
        required: false
        default: '20'
        type: string
      hl:
        description: '界面语言（en / zh-CN）'
        required: false
        default: 'en'
        type: string

permissions:
  contents: write

concurrency:
  group: gsearch-${{ github.event.inputs.key }}
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装 Chromium
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: 打印出口 IP
        run: curl -s https://api.ipify.org && echo

      - name: 搜索
        env:
          KEY: ${{ github.event.inputs.key }}
          Q: ${{ github.event.inputs.q }}
          NUM: ${{ github.event.inputs.num }}
          HL: ${{ github.event.inputs.hl }}
        run: |
          set +e
          python3 scripts/gh_gsearch.py --q "$Q" --num "${NUM:-20}" --hl "${HL:-en}" \
            --key "$KEY" --out results.json
          echo "搜索退出码 $?"

      - name: 回写结果到仓库
        run: |
          set -e
          mkdir -p data/gh_search
          cp results.json "data/gh_search/${{ github.event.inputs.key }}.json"
          find data/gh_search -type f -mmin +60 -delete || true
          git config user.name  "gh-relay-bot"
          git config user.email "gh-relay-bot@users.noreply.github.com"
          git add -A data/gh_search
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "gh-search: ${{ github.event.inputs.key }}"
            git pull --rebase --autostash origin main || true
            git push
          fi
