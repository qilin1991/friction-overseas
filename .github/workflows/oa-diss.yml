name: oa-diss
on:
  workflow_dispatch:
    inputs:
      note:
        description: "备注"
        required: false
        default: "openalex dissertation fetch"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取海外博硕学位论文
        run: python scripts/oa_diss_fetch.py

      - name: 提交产物
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "oa-diss-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f out/_oa_diss_works.jsonl 2>/dev/null || true
          git diff --cached --quiet && echo "无产物变更" || {
            git commit -m "chore: openalex dissertation artifacts [skip ci]"
            git push
          }
