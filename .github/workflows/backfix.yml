name: friction-backfix
on:
  workflow_dispatch:
    inputs:
      rerun_failed:
        description: "只重跑上次失败项（断点续跑）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: backfix
  cancel-in-progress: false

jobs:
  backfix:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run backfix (decode gnews + translate titles)
        run: |
          ARGS=""
          if [ "${{ inputs.rerun_failed }}" = "true" ]; then ARGS="--rerun-failed"; fi
          python scripts/backfix.py $ARGS

      - name: Commit results
        run: |
          git config user.name "backfix-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/backfix_result.json
          git commit -m "backfix: resolve gnews links + translate titles $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main
