name: core
on:
  workflow_dispatch:
    inputs:
      note:
        description: "备注"
        required: false
        default: "core fetch"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 CORE（全部层 + 博硕子集）
        env:
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
        run: python scripts/core_fetch.py

      - name: 提交产物
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "core-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f out/_core_works.jsonl out/_core_thesis.jsonl 2>/dev/null || true
          git diff --cached --quiet && echo "无产物变更" || {
            git commit -m "chore: core artifacts [skip ci]"
            git push
          }
