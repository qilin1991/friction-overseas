name: fetch-url

# 通用单页抓取（给 VPS 的 /wproxy gh 出口用）
#
# 背景：/wproxy 现有三个出口（CF Worker / VPS 直连 / WARP）都拿着 VPS 或 CF 边缘
# 的 IP 去请求，被 WAF 挡的站三个一起挂。Actions runner 是 Azure 海外机房出口，常能过。
#
# 🔴 为什么不用 upload-artifact 回传：artifact 的 archive_download_url 会 302 到
#    pipelines.actions.githubusercontent.com，该域名在 VPS（腾讯云）上 TLS 握手被
#    reset，下不动。改成把结果 commit 到 data/gh_fetch/<key>.json，
#    VPS 直接用 api.github.com 的 contents 接口读（这条通）。
#
# 调用方：VPS -> dispatch（带随机 key）-> 轮询 run -> 读 contents
on:
  workflow_dispatch:
    inputs:
      key:
        description: '调用方生成的随机 key（决定结果文件路径，同时用来防串号）'
        required: true
        type: string
      url:
        description: '目标 URL（http/https）'
        required: true
        type: string
      mode:
        description: 'html（原样 HTML）或 text（抽正文）'
        required: false
        default: 'html'
        type: string
      browser:
        description: '1 = 用 Chromium（JS 渲染 / 过 Cloudflare 挑战），0 = 纯 requests'
        required: false
        default: '0'
        type: string

permissions:
  contents: write

concurrency:
  group: fetch-url-${{ github.event.inputs.key }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install --quiet requests beautifulsoup4 lxml trafilatura

      - name: 装 Chromium（按需）
        if: ${{ github.event.inputs.browser == '1' }}
        continue-on-error: true
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: 打印出口 IP
        run: curl -s https://api.ipify.org && echo

      - name: 抓取
        env:
          KEY: ${{ github.event.inputs.key }}
          TARGET_URL: ${{ github.event.inputs.url }}
          MODE: ${{ github.event.inputs.mode }}
          USE_BROWSER: ${{ github.event.inputs.browser }}
        run: |
          set +e
          EXTRA=""
          if [ "$USE_BROWSER" = "1" ]; then EXTRA="--browser"; fi
          python3 scripts/gh_fetch.py --url "$TARGET_URL" --mode "$MODE" \
            $EXTRA --key "$KEY" --out page.json
          echo "抓取退出码 $?"

      - name: 回写结果到仓库
        run: |
          set -e
          mkdir -p data/gh_fetch
          cp page.json "data/gh_fetch/${{ github.event.inputs.key }}.json"
          find data/gh_fetch -type f -mmin +60 -delete || true
          git config user.name  "gh-relay-bot"
          git config user.email "gh-relay-bot@users.noreply.github.com"
          git add -A data/gh_fetch
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "gh-fetch: ${{ github.event.inputs.key }}"
            git pull --rebase --autostash origin main || true
            git push
          fi
