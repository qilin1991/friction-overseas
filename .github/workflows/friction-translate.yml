name: friction-translate

# 摩擦材料站 · 正文多源免费翻译
#
# 背景（2026-10-05）：
#   1) VPS（腾讯云）出口访问 Google 全线不通 —— 实测 translate.google.com /
#      translate.googleapis.com 均 Network unreachable，本地 LibreTranslate
#      （Argos / OPUS 通用语料）成了唯一选择。
#   2) 但 LT 在汽车领域必错，实测：caliper→卡路里、nut→坚果、
#      washer→洗衣机、bleed→出血、disc→盘子。且 LT 不支持 glossary，
#      只能在译后按术语表回改，永远在追漏网字。
#   3) Actions runner 在 Azure 机房，translate.googleapis.com 本来就通 ——
#      collect_overseas.py 已在用它翻标题，只是没翻正文。
#
# 所以：把正文翻译搬到 Actions 上，跑多源（Google 主力 + MyMemory 兜底），
#       产物写入 data/news_zh.json，VPS 侧 merge_zh() 拉取回填。
#
# ⚠️ 历史坑（务必保持）：旧 Google 通道用 sl="auto" 自动检测源语言，
#    把中文源当英文译，产出「评选的(CFSMA)」乱码。本流程一律强制 sl="en"，
#    且只处理 lang='en' 的文章 —— zh_guard.py 会在 VPS 侧再兜一道。

on:
  schedule:
    # 北京时间 01:55 / 03:55 / ...（VPS friction-translate.timer 在 :24 推队列，
    # 这里延后 31 分钟拉起来翻，形成「VPS 推 → Actions 翻 → VPS 拉回」自动闭环）
    - cron: '55 */2 * * *'
  workflow_dispatch:
    inputs:
      probe_only:
        description: '仅探测各翻译源可用性，不翻译'
        type: boolean
        default: true
      limit:
        description: '本批翻译篇数（0=不限）'
        type: string
        default: '60'
      mymemory_email:
        description: 'MyMemory 提额邮箱（可选，日限额 5千→5万字）'
        type: string
        default: ''
      probe_backup:
        description: '额外探测 Google 之外的备份源（Edge/DeepL/Papago/有道/百度）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: friction-translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 探测翻译源
        run: python scripts/probe_translate.py

      - name: 备份翻译源探测（Google 之外）
        if: ${{ inputs.probe_backup }}
        continue-on-error: true
        run: |
          python scripts/probe_more_sources.py || true
          python scripts/probe_backup2.py || true

      - name: 上传备份源探测结果
        if: ${{ inputs.probe_backup }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: probe-more-sources
          path: out/probe_*sources.json
          if-no-files-found: warn
          retention-days: 14

      - name: 正文翻译（多源）
        if: ${{ !inputs.probe_only }}
        env:
          T_LIMIT: ${{ inputs.limit }}
          MYMEMORY_EMAIL: ${{ inputs.mymemory_email }}
        run: python scripts/translate_body.py

      - name: 提交 news_zh.json
        if: ${{ !inputs.probe_only }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_zh.json data/translate_cache.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            CNT=$(python -c "import json;print(json.load(open('data/news_zh.json',encoding='utf-8'))['count'])")
            git commit -m "chore(friction): 正文译文同步 ${CNT} 条 [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: 上传探测结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-translate
          path: out/probe_translate.json
          if-no-files-found: warn
          retention-days: 14
