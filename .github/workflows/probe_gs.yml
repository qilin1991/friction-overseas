name: probe-gs
on:
  workflow_dispatch:
    inputs:
      note:
        description: "备注"
        required: false
        default: "gs probe"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 探测 Google Scholar 可达性
        run: python scripts/probe_gs.py
      - name: 提交产物
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "gs-probe-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f out/gs_probe.json 2>/dev/null || true
          git diff --cached --quiet && echo "无产物变更" || {
            git commit -m "chore: gs probe artifacts [skip ci]"
            git push
          }
