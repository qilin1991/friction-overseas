name: patent-probe
on:
  workflow_dispatch:
    inputs:
      note:
        description: "备注"
        required: false
        default: "patent channel probe"
      script:
        description: "要跑的脚本（仓库内路径）"
        required: false
        default: "scripts/probe_patent.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 探测国外专利通道可达性
        run: python ${{ github.event.inputs.script || 'scripts/probe_patent.py' }}
      - name: 提交产物
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "patent-probe-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f out/*.json 2>/dev/null || true
          git diff --cached --quiet && echo "无产物变更" || {
            git commit -m "chore: patent probe artifacts [skip ci]"
            git push
          }
